<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Math Master - Gameplay</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                "primary-dim": "#3d469f",
                "surface-container": "#e7e8ea",
                "on-primary-fixed": "#000005",
                "primary": "#4953ac",
                "on-secondary-fixed-variant": "#005965",
                "on-secondary-container": "#004f5a",
                "on-primary": "#f3f1ff",
                "surface-bright": "#f6f6f8",
                "background": "#f6f6f8",
                "on-primary-fixed-variant": "#18217d",
                "surface-variant": "#dbdde0",
                "surface-container-lowest": "#ffffff",
                "on-secondary-fixed": "#003a43",
                "primary-fixed-dim": "#858eec",
                "on-secondary": "#daf8ff",
                "primary-fixed": "#929bfa",
                "secondary-fixed": "#54e3fc",
                "error-container": "#f74b6d",
                "surface": "#f6f6f8",
                "secondary-fixed-dim": "#40d5ee",
                "inverse-primary": "#929bfa",
                "tertiary-dim": "#005d16",
                "error": "#b41340",
                "surface-dim": "#d2d4d8",
                "tertiary-container": "#91f78e",
                "on-tertiary-container": "#005e17",
                "surface-container-high": "#e1e2e5",
                "inverse-surface": "#0c0e10",
                "on-error": "#ffefef",
                "secondary": "#006573",
                "surface-container-low": "#f0f1f3",
                "error-dim": "#a70138",
                "secondary-container": "#54e3fc",
                "on-tertiary": "#d1ffc8",
                "on-tertiary-fixed-variant": "#00691a",
                "surface-tint": "#4953ac",
                "on-primary-container": "#0b1574",
                "tertiary-fixed": "#91f78e",
                "tertiary-fixed-dim": "#83e881",
                "on-error-container": "#510017",
                "on-surface-variant": "#5a5c5d",
                "surface-container-highest": "#dbdde0",
                "primary-container": "#929bfa",
                "on-surface": "#2d2f31",
                "tertiary": "#006b1b",
                "outline-variant": "#acadaf",
                "outline": "#757779",
                "on-tertiary-fixed": "#00480f",
                "inverse-on-surface": "#9c9d9f",
                "secondary-dim": "#005864",
                "on-background": "#2d2f31"
            },
            "borderRadius": {
                "DEFAULT": "1rem",
                "lg": "2rem",
                "xl": "3rem",
                "full": "9999px"
            },
            "fontFamily": {
                "headline": ["Plus Jakarta Sans"],
                "body": ["Inter"],
                "label": ["Inter"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .math-formula {
            letter-spacing: 0.05em;
        }
        .glass-card {
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.7);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background font-body text-on-surface antialiased min-h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl shadow-sm h-16 px-6 flex items-center justify-between">
<div class="flex items-center gap-3">
<button class="active:scale-95 duration-200 hover:opacity-80 transition-opacity text-indigo-700">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="text-xl font-extrabold text-indigo-900 dark:text-indigo-100 font-headline tracking-tight">Math Master</h1>
</div>
<div class="flex items-center gap-2 px-4 py-1.5 rounded-full bg-surface-container-low">
<span class="material-symbols-outlined text-primary text-lg" data-icon="stars" style="font-variation-settings: 'FILL' 1;">stars</span>
<span class="font-headline font-bold text-indigo-700">1250 pts</span>
</div>
</header>
<main class="pt-24 pb-32 px-6 max-w-2xl mx-auto flex flex-col min-h-screen">
<!-- Game Stats Row -->
<section class="flex items-center justify-between mb-8">
<div class="flex flex-col">
<span class="text-label-md text-on-surface-variant font-label uppercase tracking-widest text-[10px]">Current Level</span>
<span class="text-headline-md font-headline font-extrabold text-primary">Level 1</span>
</div>
<!-- Timer Orb -->
<div class="relative w-16 h-16 flex items-center justify-center">
<svg class="absolute inset-0 w-full h-full -rotate-90">
<circle class="text-surface-container-high" cx="32" cy="32" fill="transparent" r="28" stroke="currentColor" stroke-width="4"></circle>
<circle class="text-error-container" cx="32" cy="32" fill="transparent" r="28" stroke="currentColor" stroke-dasharray="176" stroke-dashoffset="44" stroke-width="4"></circle>
</svg>
<div class="flex flex-col items-center">
<span class="text-lg font-headline font-bold text-on-surface leading-none">30s</span>
</div>
</div>
<div class="flex flex-col items-end">
<span class="text-label-md text-on-surface-variant font-label uppercase tracking-widest text-[10px]">Score</span>
<span class="text-headline-md font-headline font-extrabold text-secondary">120</span>
</div>
</section>
<!-- Question Canvas -->
<section class="flex-grow flex flex-col justify-center">
<div class="bg-surface-container-lowest rounded-xl p-10 shadow-[0_32px_64px_-12px_rgba(45,47,49,0.06)] border border-outline-variant/10 text-center relative overflow-hidden">
<!-- Abstract background pattern -->
<div class="absolute inset-0 opacity-[0.03] pointer-events-none select-none flex items-center justify-center">
<span class="text-[200px] font-headline font-black">Σ</span>
</div>
<span class="inline-block px-4 py-1 rounded-full bg-primary-container/20 text-primary font-bold text-xs mb-6 uppercase tracking-widest">Calculus</span>
<h2 class="font-headline text-3xl font-bold leading-tight text-on-surface mb-8 math-formula">
                    What is the limit of x → 0 for <span class="text-primary underline decoration-secondary-fixed-dim/50 decoration-4 underline-offset-8">sin(x)/x</span>?
                </h2>
<!-- Feedback Area (Placeholder for active state) -->
<div class="h-1 w-full bg-surface-container-high rounded-full overflow-hidden">
<!-- Progress bar of current session -->
<div class="h-full bg-secondary w-1/3 transition-all duration-500"></div>
</div>
</div>
</section>
<!-- Answer Grid -->
<section class="mt-12 grid grid-cols-2 gap-4">
<!-- Option A -->
<button class="group relative bg-surface-container-low hover:bg-primary-container/10 active:scale-95 transition-all duration-200 p-6 rounded-lg text-left overflow-hidden">
<span class="absolute top-4 right-4 text-[10px] font-bold text-outline uppercase tracking-widest opacity-40">A</span>
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container-lowest flex items-center justify-center shadow-sm group-hover:bg-primary group-hover:text-white transition-colors">
<span class="font-headline font-bold text-lg">0</span>
</div>
<span class="font-headline font-semibold text-lg text-on-surface">Zero</span>
</div>
</button>
<!-- Option B (Simulated Highlight/Active) -->
<button class="group relative bg-primary text-on-primary active:scale-95 transition-all duration-200 p-6 rounded-lg text-left overflow-hidden shadow-lg shadow-primary/20">
<span class="absolute top-4 right-4 text-[10px] font-bold text-on-primary/40 uppercase tracking-widest">B</span>
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-on-primary/20 flex items-center justify-center shadow-inner">
<span class="font-headline font-bold text-lg">1</span>
</div>
<span class="font-headline font-semibold text-lg">One</span>
</div>
</button>
<!-- Option C -->
<button class="group relative bg-surface-container-low hover:bg-primary-container/10 active:scale-95 transition-all duration-200 p-6 rounded-lg text-left overflow-hidden">
<span class="absolute top-4 right-4 text-[10px] font-bold text-outline uppercase tracking-widest opacity-40">C</span>
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container-lowest flex items-center justify-center shadow-sm group-hover:bg-primary group-hover:text-white transition-colors">
<span class="font-headline font-bold text-lg">∞</span>
</div>
<span class="font-headline font-semibold text-lg text-on-surface">Infinity</span>
</div>
</button>
<!-- Option D -->
<button class="group relative bg-surface-container-low hover:bg-primary-container/10 active:scale-95 transition-all duration-200 p-6 rounded-lg text-left overflow-hidden">
<span class="absolute top-4 right-4 text-[10px] font-bold text-outline uppercase tracking-widest opacity-40">D</span>
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container-lowest flex items-center justify-center shadow-sm group-hover:bg-primary group-hover:text-white transition-colors">
<span class="font-headline font-bold text-lg">e</span>
</div>
<span class="font-headline font-semibold text-lg text-on-surface">Euler's</span>
</div>
</button>
</section>
<!-- Visual Feedback Indicator (Contextual Floating Action area) -->
<div class="mt-8 flex justify-center h-8">
<!-- Correct state shown as example -->
<div class="flex items-center gap-2 text-tertiary font-headline font-bold text-sm animate-pulse">
<span class="material-symbols-outlined text-lg" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                Keep it up! Master Mathematician
            </div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center pt-3 pb-8 px-4 bg-white/90 dark:bg-slate-950/90 backdrop-blur-2xl shadow-[0_-8px_30px_rgb(0,0,0,0.06)] rounded-t-[3rem] z-50">
<a class="flex flex-col items-center justify-center bg-indigo-50 dark:bg-indigo-900/40 text-indigo-700 dark:text-cyan-300 rounded-3xl px-6 py-2 active:scale-90 transition-transform duration-300 font-['Inter'] text-xs font-semibold" href="#">
<span class="material-symbols-outlined" data-icon="grid_view">grid_view</span>
<span>Menu</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-6 py-2 active:scale-90 transition-transform duration-300 font-['Inter'] text-xs font-semibold hover:text-indigo-500 dark:hover:text-cyan-300" href="#">
<span class="material-symbols-outlined" data-icon="leaderboard">leaderboard</span>
<span>Leaderboard</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-6 py-2 active:scale-90 transition-transform duration-300 font-['Inter'] text-xs font-semibold hover:text-indigo-500 dark:hover:text-cyan-300" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span>Profile</span>
</a>
</nav>
</body></html>
