<!DOCTYPE html>

<style>
        .math-pattern {
            background-color: #f6f6f8;
            background-image:  radial-gradient(#dbdde0 1px, transparent 1px), radial-gradient(#dbdde0 1px, #f6f6f8 1px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            opacity: 0.4;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface selection:bg-primary-container selection:text-on-primary-container min-h-screen overflow-x-hidden flex items-center justify-center p-4">
<!-- Background Decoration -->
<div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
<div class="absolute inset-0 math-pattern"></div>
<div class="absolute top-[-10%] right-[-10%] w-96 h-96 bg-primary-container/20 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-80 h-80 bg-secondary-container/30 rounded-full blur-[100px]"></div>
<!-- Floating Math Symbols Decorative -->
<div class="absolute top-20 left-10 text-primary-dim/10 text-6xl font-headline font-bold select-none">∫</div>
<div class="absolute bottom-40 right-20 text-secondary/10 text-8xl font-headline font-bold select-none">∑</div>
<div class="absolute top-1/2 left-[5%] text-tertiary/10 text-5xl font-headline font-bold select-none">π</div>
<div class="absolute bottom-20 left-1/4 text-primary/10 text-7xl font-headline font-bold select-none">√</div>
</div>
<!-- Main Content Shell -->
<main class="relative z-10 w-full max-w-md">
<!-- App Logo & Branding -->
<header class="flex flex-col items-center mb-12">
<div class="w-24 h-24 bg-gradient-to-br from-primary to-primary-container rounded-xl flex items-center justify-center shadow-2xl shadow-primary/20 mb-6 transform rotate-3">
<span class="material-symbols-outlined text-white text-5xl" style="font-variation-settings: 'FILL' 1;">functions</span>
</div>
<h1 class="font-headline font-extrabold text-4xl tracking-tight text-on-surface">
                Math Master
            </h1>
<p class="text-on-surface-variant font-medium mt-2">Level up your logic</p>
</header>
<!-- Login Card -->
<section class="glass-card rounded-xl p-8 shadow-sm">
<form action="#" class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="block text-sm font-semibold text-on-surface-variant ml-1" for="email">Email Address</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-xl group-focus-within:text-primary transition-colors">mail</span>
</div>
<input class="w-full bg-surface-container-low border-0 rounded-sm py-4 pl-12 pr-4 text-on-surface placeholder:text-outline focus:ring-2 focus:ring-secondary-fixed transition-all outline-none" id="email" name="email" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex items-center justify-between ml-1">
<label class="block text-sm font-semibold text-on-surface-variant" for="password">Password</label>
<a class="text-xs font-bold text-primary hover:text-primary-dim transition-colors" href="#">Forgot?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-xl group-focus-within:text-primary transition-colors">lock</span>
</div>
<input class="w-full bg-surface-container-low border-0 rounded-sm py-4 pl-12 pr-4 text-on-surface placeholder:text-outline focus:ring-2 focus:ring-secondary-fixed transition-all outline-none" id="password" name="password" placeholder="••••••••" type="password"/>
<div class="absolute inset-y-0 right-0 pr-4 flex items-center cursor-pointer">
<span class="material-symbols-outlined text-outline text-xl hover:text-on-surface">visibility</span>
</div>
</div>
</div>
<!-- Primary Login Button -->
<button class="w-full h-16 rounded-lg bg-gradient-to-r from-primary to-primary-container text-white font-headline font-bold text-lg flex items-center justify-center gap-2 shadow-lg shadow-primary/20 hover:opacity-90 active:scale-95 transition-all duration-200" type="submit">
                    Log In
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative my-10 flex items-center justify-center">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/30"></div>
</div>
<span class="relative px-4 bg-white/0 text-on-surface-variant text-xs font-bold uppercase tracking-widest">or continue with</span>
</div>
<!-- Social Login & Guest -->
<div class="space-y-4">
<button class="w-full h-14 bg-surface-container-highest hover:bg-surface-variant text-on-surface font-semibold rounded-lg flex items-center justify-center gap-3 transition-colors active:scale-95">
<img alt="Google" class="w-6 h-6" data-alt="Official Google logo with vibrant primary colors on white background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA836LHfu9aGttdL-hIkahqNUQdhNdogDQNTUfvqnxzmTZHH5qM8z_aEE527LcPqnufcatx_66ff3nzpubN_6S6ribgwTNF6t40xRxserqlv5UCwzbyVXJZX2ju7B5O-hUQXJ7jXTTPlIiraE5iscAdpNW--k0Rd82abTQyQqjr4fkhHT-mVRTdFbmWQvcEjGaYl_eJ1nClZY8WDosudcqo519SaelrB9f8p5Kvp4gdlryb6tVpbRMXZVW8G8LGwPu6qTUmH9aMvMo"/>
                    Sign up with Google
                </button>
<button class="w-full h-14 bg-white/40 hover:bg-white/60 text-on-surface font-semibold rounded-lg flex items-center justify-center gap-3 transition-colors active:scale-95 border border-outline-variant/10">
<span class="material-symbols-outlined text-on-surface-variant">person_outline</span>
                    Play as Guest
                </button>
</div>
</section>
<!-- Footer Footer -->
<footer class="mt-8 text-center space-y-4">
<p class="text-on-surface-variant text-sm font-medium">
                New to Math Master? <a class="text-primary font-bold hover:underline decoration-2 underline-offset-4 transition-all" href="#">Create Account</a>
</p>
<div class="flex items-center justify-center gap-6 pt-4">
<a class="text-xs font-bold text-outline hover:text-on-surface transition-colors" href="#">Privacy Policy</a>
<div class="w-1 h-1 rounded-full bg-outline-variant"></div>
<a class="text-xs font-bold text-outline hover:text-on-surface transition-colors" href="#">Terms of Service</a>
</div>
</footer>
</main>
<!-- Contextual Elements: Bottom Stats Bar (Visual Only) -->
<div class="fixed bottom-6 left-1/2 -translate-x-1/2 hidden md:flex items-center gap-8 px-8 py-4 bg-white/80 backdrop-blur-md rounded-full shadow-lg border border-white/20">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-tertiary" style="font-variation-settings: 'FILL' 1;">emoji_events</span>
<span class="text-sm font-headline font-bold text-on-surface">1.2M+ Solved</span>
</div>
<div class="w-px h-4 bg-outline-variant/30"></div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">group</span>
<span class="text-sm font-headline font-bold text-on-surface">50k Active</span>
</div>
</div>
</body></html>
