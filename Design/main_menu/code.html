<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Math Master - Main Menu</title>

                "on-secondary-container": "#004f5a",
                "on-primary": "#f3f1ff",
                "surface-bright": "#f6f6f8",
                "background": "#f6f6f8",

                "surface-variant": "#dbdde0",
                "surface-container-lowest": "#ffffff",
                "on-secondary-fixed": "#003a43",
                "primary-fixed-dim": "#858eec",

                "secondary-fixed": "#54e3fc",
                "error-container": "#f74b6d",

            "fontFamily": {

                "body": ["Inter"],
                "label": ["Inter"]

<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        display: inline-block;
        line-height: 1;
        text-transform: none;
        letter-spacing: normal;
        word-wrap: normal;
        white-space: nowrap;
        direction: ltr;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f6f6f8;
        color: #2d2f31;
      }
      .glass-panel {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar -->
<nav class="fixed top-0 w-full z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl shadow-sm">
<div class="flex items-center justify-between px-6 h-16 w-full">
<div class="flex items-center gap-3">
<button class="active:scale-95 duration-200 hover:opacity-80 transition-opacity text-indigo-700 dark:text-indigo-400">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<span class="text-xl font-extrabold text-indigo-900 dark:text-indigo-100 font-['Plus_Jakarta_Sans'] tracking-tight">Math Master</span>
</div>
<div class="flex items-center gap-2 px-4 py-1.5 bg-indigo-50 dark:bg-indigo-900/30 rounded-full">
<span class="material-symbols-outlined text-indigo-600 text-sm" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="text-indigo-700 dark:text-indigo-400 font-['Plus_Jakarta_Sans'] font-bold tracking-tight text-sm">1250 pts</span>
</div>
</div>
</nav>
<!-- Main Content Canvas -->
<main class="flex-1 mt-16 mb-32 px-6 pt-8 max-w-2xl mx-auto w-full">
<!-- Welcome Header -->
<header class="mb-10 text-center md:text-left flex flex-col md:flex-row md:items-end justify-between gap-4">
<div>
<h1 class="text-[3.5rem] leading-none font-headline font-extrabold text-primary tracking-tight">
                    Hello, Alex!
                </h1>
<p class="text-on-surface-variant font-body text-lg mt-2">Ready to flex those brain muscles today?</p>
</div>
<div class="flex items-center justify-center md:justify-start gap-2 bg-surface-container-low px-6 py-4 rounded-lg">
<span class="text-label-md text-on-surface-variant uppercase tracking-widest font-semibold">Total Score</span>
<span class="text-2xl font-headline font-bold text-secondary">1500</span>
</div>
</header>
<!-- Hero Mascot Section -->
<section class="relative mb-12 aspect-[4/3] rounded-xl overflow-hidden bg-primary-container/20 flex items-center justify-center">
<div class="absolute inset-0 opacity-10 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-primary via-transparent to-transparent"></div>
<!-- Geometric Texture Background -->
<div class="absolute inset-0 opacity-[0.03]" style="background-image: radial-gradient(#4953ac 2px, transparent 2px); background-size: 32px 32px;"></div>
<div class="relative z-10 flex flex-col items-center">
<img alt="Math Mascot Owl" class="w-64 h-64 object-contain" data-alt="a friendly minimalist 3d cartoon owl wearing glasses and holding a glowing mathematical symbol in a bright academic studio setting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuApg0lNBihRKzrLUCxcZykL6eMPbp3K8mraaEnP9wzkzSFNEZveOlpKEisVFJL069_C2oZnLuWF2f32k-kSVULu5XWb_-pHoBa8cGxGkby4HVnr-lULmDNvEmEkCBWW-iis3e4mBAG1chHKWSXDPIWLMdUe3chjEB_Hx5HYyY4tw8tzfAmrfStKZxyV50NdHZy2oMJDXgPk5SgD4bnaQH-pCzdZIFu839XNigTrR9pHBjPjl33X1GO6ZS6f3Y6e1e64hhR3RjH7utM"/>
<div class="mt-4 px-6 py-2 glass-panel rounded-full shadow-lg border border-white/20">
<p class="font-headline font-bold text-primary-dim text-lg">Level 12: Calculus Cadet</p>
</div>
</div>
</section>
<!-- Primary Action -->
<div class="space-y-6">
<button class="w-full bg-gradient-to-br from-primary to-primary-fixed h-20 rounded-lg flex items-center justify-center gap-4 text-on-primary shadow-xl hover:opacity-90 active:scale-95 transition-all duration-300 group">
<span class="text-2xl font-headline font-extrabold tracking-tight">Play Now</span>
<span class="material-symbols-outlined text-3xl group-hover:translate-x-1 transition-transform" data-icon="play_arrow" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
<!-- Bento Grid Secondary Actions -->
<div class="grid grid-cols-2 gap-6">
<!-- Leaderboard Card -->
<button class="flex flex-col items-start p-8 bg-surface-container-low rounded-lg active:scale-95 transition-transform text-left group">
<div class="w-12 h-12 bg-white rounded-full flex items-center justify-center mb-6 shadow-sm group-hover:bg-indigo-50 transition-colors">
<span class="material-symbols-outlined text-primary" data-icon="leaderboard" style="font-variation-settings: 'FILL' 1;">leaderboard</span>
</div>
<span class="text-on-surface-variant font-label text-xs font-semibold uppercase tracking-widest mb-1">Rank #42</span>
<span class="text-xl font-headline font-bold text-on-surface">Leaderboard</span>
</button>
<!-- Settings Card -->
<button class="flex flex-col items-start p-8 bg-surface-container-low rounded-lg active:scale-95 transition-transform text-left group">
<div class="w-12 h-12 bg-white rounded-full flex items-center justify-center mb-6 shadow-sm group-hover:bg-slate-50 transition-colors">
<span class="material-symbols-outlined text-outline" data-icon="settings">settings</span>
</div>
<span class="text-on-surface-variant font-label text-xs font-semibold uppercase tracking-widest mb-1">Preferences</span>
<span class="text-xl font-headline font-bold text-on-surface">Settings</span>
</button>
</div>
</div>
<!-- Daily Challenge Preview -->
<section class="mt-12 bg-surface-container-lowest rounded-xl p-8 shadow-sm border border-outline-variant/10 relative overflow-hidden">
<div class="absolute top-0 right-0 p-6 opacity-10">
<span class="material-symbols-outlined text-8xl" data-icon="calculate">calculate</span>
</div>
<h3 class="text-xl font-headline font-bold text-on-surface mb-4">Daily Challenge</h3>
<p class="text-on-surface-variant mb-6 pr-12">Solve 5 geometry problems to earn a <span class="text-tertiary font-bold">Double XP Boost</span>.</p>
<div class="flex items-center gap-4">
<div class="flex-1 h-3 bg-surface-container rounded-full overflow-hidden">
<div class="w-[60%] h-full bg-tertiary-fixed-dim rounded-full"></div>
</div>
<span class="font-headline font-bold text-on-surface">3/5</span>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full rounded-t-[3rem] z-50 bg-white/90 dark:bg-slate-950/90 backdrop-blur-2xl shadow-[0_-8px_30px_rgb(0,0,0,0.06)]">
<div class="fixed bottom-0 left-0 w-full flex justify-around items-center pt-3 pb-8 px-4">
<!-- Menu Active -->
<button class="flex flex-col items-center justify-center bg-indigo-50 dark:bg-indigo-900/40 text-indigo-700 dark:text-cyan-300 rounded-3xl px-6 py-2 active:scale-90 transition-transform duration-300">
<span class="material-symbols-outlined mb-1" data-icon="grid_view" style="font-variation-settings: 'FILL' 1;">grid_view</span>
<span class="font-['Inter'] text-xs font-semibold">Menu</span>
</button>
<!-- Leaderboard Inactive -->
<button class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-6 py-2 hover:text-indigo-500 dark:hover:text-cyan-300 active:scale-90 transition-transform duration-300">
<span class="material-symbols-outlined mb-1" data-icon="leaderboard">leaderboard</span>
<span class="font-['Inter'] text-xs font-semibold">Leaderboard</span>
</button>
<!-- Profile Inactive -->
<button class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-6 py-2 hover:text-indigo-500 dark:hover:text-cyan-300 active:scale-90 transition-transform duration-300">
<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span class="font-['Inter'] text-xs font-semibold">Profile</span>
</button>
</div>
</nav>
</body></html>
